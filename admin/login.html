<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập admin · Vé Mở</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #faf7f2;
      color: #201c22;
      font: 16px Arial, sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 30px;
      background: #fffdfa;
      border: 1px solid #ded5ca;
      border-radius: 14px;
    }
    a { color: #903745; }
    form, label { display: grid; gap: 8px; }
    form { gap: 16px; }
    input, button { padding: 11px; border-radius: 6px; font: inherit; }
    input { border: 1px solid #bdb1a7; }
    button { border: 0; background: #201c22; color: white; cursor: pointer; }
    #message { color: #922d32; }
  </style>
</head>
<body>
  <main>
    <a href="/">← Trang bán vé</a>
    <h1>Đăng nhập admin</h1>

    <form id="login">
      <label>
        Tên đăng nhập
        <input name="username" autocomplete="username" maxlength="60" required>
      </label>

      <label>
        Mật khẩu
        <input name="password" type="password" autocomplete="current-password"
          maxlength="128" required>
      </label>

      <button type="submit">Đăng nhập</button>
    </form>

    <p id="message" role="alert"></p>
  </main>

  <script>
    const form = document.getElementById('login');
    const message = document.getElementById('message');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message);

        location.replace('/admin/index');
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
