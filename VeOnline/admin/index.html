<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị vé · Vé Mở</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf7f2; color: #201c22; font: 16px/1.5 Arial, sans-serif; }
    main { max-width: 1120px; margin: auto; padding: 24px; }
    header, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    header { justify-content: space-between; margin-bottom: 20px; }
    h1, h2, h3 { margin: 0 0 12px; }
    header h1 { margin: 0; }
    a, .danger { color: #903745; }
    section { background: #fffdfa; border: 1px solid #ded5ca; border-radius: 10px; padding: 20px; margin-bottom: 18px; }
    form, label { display: grid; gap: 6px; }
    form { gap: 12px; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    input, select, textarea, button { font: inherit; padding: 8px 10px; border: 1px solid #bdb1a7; border-radius: 6px; background: white; }
    input, select, textarea { width: 100%; }
    textarea { resize: vertical; }
    button { cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .primary { background: #201c22; color: white; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ded5ca; }
    td small { display: block; }
    td code { overflow-wrap: anywhere; }
    .row-actions { white-space: nowrap; }
    .row-actions button + button { margin-left: 6px; }
    [data-error="true"] { color: #922d32; }
    #video { width: min(100%, 420px); margin-top: 12px; }
    #checkin-form { max-width: 540px; margin-top: 12px; }
    @media (max-width: 600px) {
      .fields { grid-template-columns: 1fr; }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Quản trị vé</h1>
      <div class="actions">
        <a href="/">Trang bán vé</a>
        <button id="logout" type="button">Đăng xuất</button>
      </div>
    </header>

    <p id="message" role="status" aria-live="polite"></p>

    <section>
      <h2>Quản lý sự kiện</h2>

      <form id="event-form">
        <h3 id="editor-title">Thêm sự kiện</h3>

        <div class="fields">
          <label>Tên sự kiện
            <input name="title" maxlength="100" required>
          </label>

          <label>Danh mục
            <select name="category">
              <option>Âm nhạc</option>
              <option>Workshop</option>
              <option>Triển lãm</option>
            </select>
          </label>

          <label>Ngày giờ
            <input name="date" placeholder="19:30 · 19/12/2026" maxlength="60" required>
          </label>

          <label>Địa điểm
            <input name="venue" maxlength="120" required>
          </label>

          <label>Giá vé (VNĐ)
            <input name="price" type="number" min="0" max="100000000" step="1" required>
          </label>

          <label>Số vé còn lại
            <input name="remaining" type="number" min="0" max="100000" step="1" required>
          </label>
        </div>

        <label>Mô tả
          <textarea name="description" rows="3" maxlength="1000" required></textarea>
        </label>

        <div class="actions">
          <button class="primary" id="save-event" type="submit">Thêm sự kiện</button>
          <button id="cancel-edit" type="button" hidden>Hủy sửa</button>
          <button id="reload-events" type="button">Tải lại</button>
        </div>
      </form>

      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Sự kiện</th><th>Ngày giờ</th><th>Giá vé</th>
              <th>Còn lại</th><th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="events"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Check-in bằng QR</h2>
      <button id="camera" type="button">Mở camera</button>
      <video id="video" autoplay muted playsinline hidden
        aria-label="Camera quét QR"></video>

      <form id="checkin-form">
        <label>Mã đặt vé hoặc đường dẫn từ QR
          <input id="code" name="code" maxlength="256" autocomplete="off" required>
        </label>
        <button class="primary" type="submit">Xác nhận check-in</button>
      </form>

      <p id="checkin-message" role="status" aria-live="polite"></p>
    </section>

    <section>
      <div class="actions">
        <h2>Đơn đặt vé</h2>
        <button id="reload-orders" type="button">Tải lại đơn</button>
      </div>

      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Sự kiện</th><th>Khách hàng</th><th>Số vé</th>
              <th>Mã đặt vé</th><th>Check-in</th>
            </tr>
          </thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/admin/jsQR.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const eventForm = el('event-form');
    const checkinForm = el('checkin-form');
    const cameraButton = el('camera');
    const video = el('video');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d', { willReadFrequently: true });
    const money = new Intl.NumberFormat('vi-VN', {
      style: 'currency',
      currency: 'VND',
    });

    const uuid = '[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}';
    const directCode = new RegExp('^(?:VEMO:)?(' + uuid + ')$', 'i');
    const ticketPath = new RegExp('^/ticket/(' + uuid + ')/?$', 'i');

    let editing = null;
    let stream = null;
    let frame = null;
    let cameraAttempt = 0;
    let lastScan = 0;

    function readCode(value) {
      if (typeof value !== 'string') return null;
      const raw = value.trim();

      const directMatch = directCode.exec(raw);
      if (directMatch) return directMatch[1].toUpperCase();

      try {
        const url = new URL(raw);
        if (url.protocol !== 'http:' && url.protocol !== 'https:') return null;

        const match = ticketPath.exec(url.pathname);
        return match ? match[1].toUpperCase() : null;
      } catch {
        return null;
      }
    }

    async function api(path, method = 'GET', data) {
      const response = await fetch('/api/admin/' + path, {
        method,
        credentials: 'same-origin',
        headers: data === undefined ? undefined : { 'Content-Type': 'application/json' },
        body: data === undefined ? undefined : JSON.stringify(data),
      });

      if (response.status === 401) {
        location.replace('/admin/login');
        throw new Error('Phiên đăng nhập đã hết hạn.');
      }

      const result = await response.json().catch(() => null);
      if (!response.ok || result === null) {
        throw new Error(result?.message || 'Không kết nối được với API.');
      }

      return result;
    }

    function show(id, message, isError = false) {
      const target = el(id);
      target.textContent = message;
      target.dataset.error = String(isError);
    }

    function cell(row, value) {
      const td = row.insertCell();
      td.textContent = value ?? '';
      return td;
    }

    function actionButton(label, handler, className = '') {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.className = className;
      button.addEventListener('click', handler);
      return button;
    }

    function clearEditor() {
      editing = null;
      eventForm.reset();
      el('editor-title').textContent = 'Thêm sự kiện';
      el('save-event').textContent = 'Thêm sự kiện';
      el('cancel-edit').hidden = true;
    }

    function editEvent(item) {
      editing = { id: item._id, originalRemaining: item.remaining };

      for (const field of ['title', 'category', 'date', 'venue', 'price', 'remaining', 'description']) {
        eventForm.elements.namedItem(field).value = item[field] ?? '';
      }

      el('editor-title').textContent = 'Sửa sự kiện';
      el('save-event').textContent = 'Lưu thay đổi';
      el('cancel-edit').hidden = false;
      eventForm.elements.namedItem('title').focus();
    }

    async function deleteEvent(item, button) {
      if (!confirm(`Xóa sự kiện "${item.title}" khỏi trang bán vé?`)) return;

      button.disabled = true;

      try {
        await api('events/' + encodeURIComponent(item._id), 'DELETE');
        if (editing?.id === item._id) clearEditor();
        show('message', 'Đã xóa sự kiện khỏi trang bán vé.');
        await loadEvents();
      } catch (error) {
        show('message', error.message, true);
      } finally {
        button.disabled = false;
      }
    }

    async function loadEvents() {
      const items = await api('events');
      const body = el('events');
      body.replaceChildren();

      if (!items.length) {
        cell(body.insertRow(), 'Chưa có sự kiện.').colSpan = 5;
        return;
      }

      for (const item of items) {
        const row = body.insertRow();
        cell(row, item.title);
        cell(row, item.date);
        cell(row, money.format(item.price));
        cell(row, item.remaining);

        const actions = row.insertCell();
        actions.className = 'row-actions';
        actions.append(
          actionButton('Sửa', () => editEvent(item)),
          actionButton('Xóa', (event) => deleteEvent(item, event.currentTarget), 'danger'),
        );
      }
    }

    async function loadOrders() {
      const orders = await api('bookings');
      const body = el('orders');
      body.replaceChildren();

      if (!orders.length) {
        cell(body.insertRow(), 'Chưa có đơn đặt vé.').colSpan = 5;
        return;
      }

      for (const order of orders) {
        const row = body.insertRow();
        cell(row, order.eventTitle);

        const customer = cell(row, order.name);
        const email = document.createElement('small');
        email.textContent = order.email;
        customer.append(email);

        cell(row, order.quantity);

        const code = document.createElement('code');
        code.textContent = order.code;
        row.insertCell().append(code);

        cell(row, order.checkedInAt
          ? new Date(order.checkedInAt).toLocaleString('vi-VN')
          : 'Chưa check-in');
      }
    }

    eventForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const current = editing;
      const button = el('save-event');
      const data = Object.fromEntries(new FormData(eventForm));
      data.price = Number(data.price);
      data.remaining = Number(data.remaining);
      button.disabled = true;

      try {
        if (current) {
          data.originalRemaining = current.originalRemaining;
          await api('events/' + encodeURIComponent(current.id), 'PUT', data);
        } else {
          await api('events', 'POST', data);
        }

        clearEditor();
        show('message', current ? 'Đã lưu thay đổi.' : 'Đã thêm sự kiện.');
        await loadEvents();
      } catch (error) {
        show('message', error.message, true);
      } finally {
        button.disabled = false;
      }
    });

    function stopCamera() {
      cameraAttempt += 1;
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;

      stream?.getTracks().forEach((track) => track.stop());
      stream = null;
      video.srcObject = null;
      video.hidden = true;
      cameraButton.textContent = 'Mở camera';
    }

    function scan(now) {
      if (!stream) return;

      if (video.readyState >= 2 && video.videoWidth && now - lastScan >= 150) {
        lastScan = now;
        const scale = Math.min(1, 640 / video.videoWidth);
        canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(video.videoHeight * scale));

        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        const result = window.jsQR(image.data, image.width, image.height);
        const scannedCode = readCode(result?.data);

        if (scannedCode) {
          el('code').value = scannedCode;
          stopCamera();
          show('checkin-message', 'Đã đọc QR. Bấm Xác nhận check-in để lưu.');
          return;
        }
      }

      frame = requestAnimationFrame(scan);
    }

    cameraButton.addEventListener('click', async () => {
      if (stream) {
        stopCamera();
        return;
      }

      const attempt = ++cameraAttempt;
      cameraButton.disabled = true;
      show('checkin-message', '');

      try {
        if (!navigator.mediaDevices?.getUserMedia || !context || !window.jsQR) {
          throw new Error('Camera chưa sẵn sàng. Mở Admin trên localhost hoặc dán mã vé.');
        }

        const opened = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' } },
        });

        if (attempt !== cameraAttempt) {
          opened.getTracks().forEach((track) => track.stop());
          return;
        }

        stream = opened;
        video.srcObject = stream;
        video.hidden = false;
        cameraButton.textContent = 'Tắt camera';
        await video.play();

        if (attempt === cameraAttempt) {
          lastScan = 0;
          frame = requestAnimationFrame(scan);
        }
      } catch (error) {
        if (attempt !== cameraAttempt) return;
        stopCamera();
        show('checkin-message', error.name === 'NotAllowedError'
          ? 'Hãy cấp quyền camera hoặc dán mã vé vào ô bên dưới.'
          : error.message, true);
      } finally {
        cameraButton.disabled = false;
      }
    });

    checkinForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const code = readCode(el('code').value);
      if (!code) {
        show('checkin-message', 'Mã đặt vé hoặc đường dẫn QR không hợp lệ.', true);
        return;
      }

      stopCamera();
      const button = checkinForm.querySelector('button');
      button.disabled = true;
      show('checkin-message', '');

      try {
        const order = await api('check-in', 'POST', { code });
        checkinForm.reset();
        show('checkin-message', `Đã check-in ${order.quantity} vé · ${order.eventTitle}`);
      } catch (error) {
        show('checkin-message', error.message, true);
        return;
      } finally {
        button.disabled = false;
      }

      loadOrders().catch((error) => show('message', error.message, true));
    });

    el('cancel-edit').addEventListener('click', clearEditor);

    el('reload-events').addEventListener('click', async () => {
      try {
        await loadEvents();
        clearEditor();
        show('message', 'Đã tải lại danh sách sự kiện.');
      } catch (error) {
        show('message', error.message, true);
      }
    });

    el('reload-orders').addEventListener('click', () => {
      loadOrders().catch((error) => show('message', error.message, true));
    });

    el('logout').addEventListener('click', async () => {
      stopCamera();

      try {
        await api('logout', 'POST', {});
        location.replace('/admin/login');
      } catch (error) {
        show('message', error.message, true);
      }
    });

    window.addEventListener('pagehide', stopCamera);

    Promise.all([loadEvents(), loadOrders()])
      .catch((error) => show('message', error.message, true));
  </script>
</body>
</html>
